<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">OpenMako public review card</title>
  <desc id="desc">Short reviewer-facing proof summary for OpenMako v0.1.</desc>
  <rect width="1200" height="1200" fill="#f8fafc"/>
  <rect x="72" y="72" width="1056" height="1056" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="72" y="72" width="1056" height="148" rx="28" fill="#0f172a"/>
  <rect x="72" y="180" width="1056" height="40" fill="#0f172a"/>

  <text x="120" y="154" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">OpenMako</text>
  <text x="882" y="148" fill="#a7f3d0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">public v0.1</text>

  <text x="120" y="304" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Evidence checks for agent run records</text>
  <text x="120" y="354" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="27">Current public proof covers: learning effect, patch scope,</text>
  <text x="120" y="396" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="27">test proof, supplied audits, provenance, and adapters.</text>

  <rect x="120" y="472" width="452" height="156" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="154" y="532" fill="#14532d" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">checks</text>
  <text x="154" y="584" fill="#14532d" font-family="Arial, Helvetica, sans-serif" font-size="26">learning effect</text>

  <rect x="628" y="472" width="452" height="156" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="662" y="532" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">flags</text>
  <text x="662" y="584" fill="#1e3a8a" font-family="Arial, Helvetica, sans-serif" font-size="26">patch-scope drift</text>

  <rect x="120" y="668" width="452" height="156" rx="16" fill="#fefce8" stroke="#fde68a" stroke-width="2"/>
  <text x="154" y="728" fill="#713f12" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">requires</text>
  <text x="154" y="780" fill="#713f12" font-family="Arial, Helvetica, sans-serif" font-size="26">test proof</text>

  <rect x="628" y="668" width="452" height="156" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="662" y="728" fill="#4c1d95" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">audits</text>
  <text x="662" y="780" fill="#4c1d95" font-family="Arial, Helvetica, sans-serif" font-size="26">supplied records</text>

  <text x="120" y="914" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Boundary check</text>
  <text x="120" y="962" fill="#2563eb" font-family="Arial, Helvetica, sans-serif" font-size="28">github.com/1966536805l-crypto/openmako/issues/2</text>
  <text x="120" y="1022" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="25">Does not claim broad repair or external review.</text>
</svg>
