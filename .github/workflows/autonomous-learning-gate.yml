name: autonomous-learning-gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/autonomous-learning-gate.yml"
      - "scripts/autonomous_task_source_provenance.json"
      - "scripts/autonomous_learning_gate.sh"
      - "scripts/independent_external_heldout_benchmark_gate.sh"
      - "scripts/publish_autonomous_public_evidence_branch.sh"
      - "scripts/remote_autonomous_learning_snapshot.sh"
      - "scripts/remote_autonomous_public_evidence_snapshot.sh"
      - "scripts/supplied_transcript_adapter_matrix.sh"
      - "benchmarks/independent_external_heldout/v0.1/cases.json"
      - "PROGRESS.md"
      - "quantagent/agent_loop_core.py"
      - "quantagent/coding_bench.py"
      - "quantagent/evidence_court.py"
      - "quantagent/learning_effect_coding_bench.py"
      - "quantagent/skill_learning.py"
      - "quantagent/skill_pipeline.py"
      - "tests/test_cli_wrappers.py"
      - "tests/test_learning_effect_e2e.py"
      - "tests/test_skill_learning.py"
      - "tests/test_upstream_function_file_bundle_regression.py"
      - "tests/test_external_heldout_benchmark_gate.py"
      - "tests/test_public_metadata.py"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  autonomous-learning-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest typing_extensions

      - name: Run autonomous-learning stress gate
        run: |
          bash scripts/autonomous_learning_gate.sh

      - name: Upload autonomous-learning summary and logs
        id: upload-autonomous-artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-learning-gate-summary
          path: .quantagent/autonomous_learning_gate
          if-no-files-found: error

      - name: Publish autonomous public evidence branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          OPENMAKO_AUTONOMOUS_LEARNING_GATE_DIR: .quantagent/autonomous_learning_gate
          OPENMAKO_PUBLIC_EVIDENCE_REMOTE: origin
          OPENMAKO_PUBLIC_EVIDENCE_BRANCH: public-evidence
          OPENMAKO_AUTONOMOUS_RUN_ID: ${{ github.run_id }}
          OPENMAKO_AUTONOMOUS_RUN_ATTEMPT: ${{ github.run_attempt }}
          OPENMAKO_AUTONOMOUS_ARTIFACT_NAME: autonomous-learning-gate-summary
          OPENMAKO_AUTONOMOUS_ARTIFACT_ID: ${{ steps.upload-autonomous-artifact.outputs.artifact-id }}
          OPENMAKO_AUTONOMOUS_ARTIFACT_DIGEST: ${{ steps.upload-autonomous-artifact.outputs.artifact-digest }}
          OPENMAKO_AUTONOMOUS_ARTIFACT_URL: ${{ steps.upload-autonomous-artifact.outputs.artifact-url }}
        run: |
          bash scripts/publish_autonomous_public_evidence_branch.sh
