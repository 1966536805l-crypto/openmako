name: despair-gate

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  despair-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run local high-intensity verification gate
        run: |
          bash scripts/despair_gate.sh

      - name: Upload CodingBench artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: despair-gate-coding-bench
          path: |
            .quantagent/coding_bench
            .quantagent/despair_gate
          if-no-files-found: ignore
