name: focused

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  focused-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused OpenMako evidence gate
        env:
          OPENMAKO_PUBLIC_REVIEW_GATE_ARTIFACT_DIR: .quantagent/public_review_gate
        run: |
          bash scripts/public_review_gate.sh

      - name: Upload focused public gate artifact
        id: upload-focused-artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: focused-public-review-gate
          path: .quantagent/public_review_gate
          if-no-files-found: error

      - name: Publish focused public evidence branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        env:
          OPENMAKO_PUBLIC_REVIEW_GATE_ARTIFACT_DIR: .quantagent/public_review_gate
          OPENMAKO_PUBLIC_EVIDENCE_REMOTE: origin
          OPENMAKO_PUBLIC_EVIDENCE_BRANCH: public-evidence
          OPENMAKO_FOCUSED_RUN_ID: ${{ github.run_id }}
          OPENMAKO_FOCUSED_RUN_ATTEMPT: ${{ github.run_attempt }}
          OPENMAKO_FOCUSED_ARTIFACT_NAME: focused-public-review-gate
          OPENMAKO_FOCUSED_ARTIFACT_ID: ${{ steps.upload-focused-artifact.outputs.artifact-id }}
          OPENMAKO_FOCUSED_ARTIFACT_DIGEST: ${{ steps.upload-focused-artifact.outputs.digest }}
          OPENMAKO_FOCUSED_ARTIFACT_URL: ${{ steps.upload-focused-artifact.outputs.artifact-url }}
        run: |
          bash scripts/publish_public_evidence_branch.sh
