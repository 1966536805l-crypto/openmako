name: focused

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  focused-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run focused OpenMako evidence gate
        env:
          OPENMAKO_PUBLIC_REVIEW_GATE_ARTIFACT_DIR: .quantagent/public_review_gate
        run: |
          bash scripts/public_review_gate.sh

      - name: Upload focused public gate artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: focused-public-review-gate
          path: .quantagent/public_review_gate
          if-no-files-found: error
